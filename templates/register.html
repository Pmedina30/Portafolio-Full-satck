{% extends "base.html" %}

{% block title %}Create Account - PyStack{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create an Account</h2>
      <p>Start your journey with modern Python web development</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-input" 
          placeholder="Jane Doe" 
          value="{{ name or '' }}" 
          required 
          autocomplete="name"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="jane@example.com" 
          value="{{ email or '' }}" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="At least 6 characters" 
          minlength="6"
          required 
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-input" 
          placeholder="Repeat password" 
          minlength="6"
          required 
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Create Account</button>
    </form>

    <div class="auth-bottom-text">
      Already have an account? <a href="{{ url_for('login') }}">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
